# Place this file at: Frontend/nginx.frontend.conf
# This runs INSIDE the frontend container and just serves the built React app.
# It is NOT the same as the server-level Nginx that handles your domain + HTTPS.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router / client-side routing: always fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
